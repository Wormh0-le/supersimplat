name: CI

on:
    workflow_dispatch:
    push:
        branches: [main, ai-select-v1]
        paths-ignore: ['README.md', 'LICENSE']
    pull_request:
        branches: [main]
        paths-ignore: ['README.md', 'LICENSE']

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        timeout-minutes: 20

        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Use Python 3.12.12
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12.12'

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true

            - name: Install
              run: npm ci

            - name: Test
              run: npm test

    build:
        name: Build
        runs-on: ubuntu-latest

        timeout-minutes: 10

        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install
              run: npm ci

            - name: Build
              run: npm run build

    lint:
        name: Lint
        runs-on: ubuntu-latest

        timeout-minutes: 10

        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Lint locales
              run: npm run lint:locales
