name: CI

on:
    workflow_dispatch:
    push:
        branches: [main, ai-select-v1]
        paths-ignore: ['README.md', 'LICENSE']
    pull_request:
        branches: [main, ai-select-v1]
        paths-ignore: ['README.md', 'LICENSE']

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        timeout-minutes: 20

        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Use Python 3.12.12
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12.12'

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true

            - name: Record CPU verification boundary
              shell: bash
              env:
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  mkdir -p "$RUNNER_TEMP/ci-evidence"
                  {
                      printf 'run=%s attempt=%s event=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME"
                      printf 'event_sha=%s pr_head=%s pr_base=%s\n' "$GITHUB_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA"
                      printf 'checkout_sha='
                      git rev-parse HEAD
                      printf '\nVerification scope: TypeScript and Companion base CPU/contracts; not locked-GPU qualification.\n'
                      node --version
                      npm --version
                      python --version
                      uv --version
                      printf '\nInput checksums:\n'
                      sha256sum package.json package-lock.json selection-service-companion/pyproject.toml selection-service-companion/uv.lock
                      printf '\nTracked Companion tests:\n'
                      git ls-files 'selection-service-companion/tests/test_*.py'
                  } | tee "$RUNNER_TEMP/ci-evidence/boundary.txt"

            - name: Install
              run: npm ci

            - name: Test
              shell: bash
              run: |
                  set -o pipefail
                  trap 'result=$?; printf "%s\n" "$result" > "$RUNNER_TEMP/ci-evidence/test-exit-code.txt"' EXIT
                  npm test 2>&1 | tee "$RUNNER_TEMP/ci-evidence/npm-test.log"

            - name: Preserve CPU test evidence
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: cpu-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node-version }}
                  path: ${{ runner.temp }}/ci-evidence/
                  if-no-files-found: warn
                  retention-days: 14

    build:
        name: Build
        runs-on: ubuntu-latest

        timeout-minutes: 10

        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install
              run: npm ci

            - name: Build
              run: npm run build

    lint:
        name: Lint
        runs-on: ubuntu-latest

        timeout-minutes: 10

        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Lint locales
              run: npm run lint:locales
