name: Teatime asset preparation
on:
  workflow_dispatch:
  push:
    branches: [bench/lerf-teatime-benchmark]
    paths:
      - scripts/prepare-teatime.py
      - benchmarks/teatime/**
      - .github/workflows/teatime-benchmark.yml
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.12'
      - name: Install image reader for asset preparation only
        run: python -m pip install Pillow==11.3.0
      - name: Check pinned archives and prepare published annotations
        run: |
          set -o pipefail
          python scripts/prepare-teatime.py --out "$RUNNER_TEMP/teatime" --with-model | tee "$RUNNER_TEMP/teatime-inventory.log"
      - name: Preserve annotations, calibration and actual provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teatime-source-annotations-${{ github.sha }}
          path: |
            ${{ runner.temp }}/teatime/prepared/
            ${{ runner.temp }}/teatime-inventory.log
          if-no-files-found: error
          retention-days: 30
