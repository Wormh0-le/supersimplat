<!doctype html>
<meta charset="utf-8" />
<title>Ticket 19 browser effective snapshot profile</title>
<pre id="result">running</pre>
<script>
    'use strict';

    const count = 250000;
    const deletedStride = 16;
    const memory = () =>
        performance.memory
            ? {
                  usedJsHeapBytes: performance.memory.usedJSHeapSize,
                  totalJsHeapBytes: performance.memory.totalJSHeapSize
              }
            : { usedJsHeapBytes: null, totalJsHeapBytes: null };
    const phases = [];
    const phase = (name, run) => {
        const before = memory();
        const started = performance.now();
        const value = run();
        phases.push({
            name,
            milliseconds: performance.now() - started,
            before,
            after: memory()
        });
        return value;
    };

    const source = phase('source-allocation', () => ({
        state: new Uint8Array(count),
        stableIds: Uint32Array.from({ length: count }, (_, index) => index),
        means: new Float32Array(count * 3),
        rotations: new Float32Array(count * 4),
        logScales: new Float32Array(count * 3),
        opacity: new Float32Array(count),
        dc: new Float32Array(count * 3),
        palette: new Uint16Array(count)
    }));
    phase('editor-mutations', () => {
        for (let index = 0; index < count; index += 1) {
            const vector = index * 3;
            source.means[vector] = (index % 500) * 0.01;
            source.means[vector + 1] = Math.floor(index / 500) * 0.01;
            source.means[vector + 2] = 5;
            source.rotations[index * 4 + 3] = 1;
            source.opacity[index] = 2;
            source.dc[vector] = 0.1;
            source.dc[vector + 1] = 0.2;
            source.dc[vector + 2] = 0.3;
            source.palette[index] = index % 7 === 0 ? 1 : 0;
            if (index % deletedStride === 0) source.state[index] = 4;
        }
    });
    const effectiveCount = count - Math.ceil(count / deletedStride);
    const effective = phase('effective-snapshot', () => {
        const result = {
            stableIds: new Uint32Array(effectiveCount),
            means: new Float32Array(effectiveCount * 3),
            rotations: new Float32Array(effectiveCount * 4),
            logScales: new Float32Array(effectiveCount * 3),
            opacity: new Float32Array(effectiveCount),
            dc: new Float32Array(effectiveCount * 3)
        };
        let row = 0;
        for (let index = 0; index < count; index += 1) {
            if (source.state[index] & 4) continue;
            const input = index * 3;
            const output = row * 3;
            const paletteY = source.palette[index] === 1 ? 2 : 0;
            result.stableIds[row] = source.stableIds[index];
            result.means[output] = source.means[input] + 10;
            result.means[output + 1] = source.means[input + 1] + paletteY;
            result.means[output + 2] = source.means[input + 2];
            result.rotations.set(
                source.rotations.subarray(index * 4, index * 4 + 4),
                row * 4
            );
            result.logScales.set(
                source.logScales.subarray(input, input + 3),
                output
            );
            result.opacity[row] = source.opacity[index] + Math.log(0.75);
            result.dc[output] = source.dc[input] * 0.88 + 0.05;
            result.dc[output + 1] = source.dc[input + 1] * 0.9 + 0.05;
            result.dc[output + 2] = source.dc[input + 2] * 0.72 + 0.05;
            row += 1;
        }
        return result;
    });
    phase('bounded-transfer-chunk', () => {
        const chunk = new Uint8Array(4 * 1024 * 1024);
        chunk.set(
            new Uint8Array(
                effective.means.buffer,
                effective.means.byteOffset,
                Math.min(chunk.byteLength, effective.means.byteLength)
            )
        );
        return chunk;
    });

    const report = {
        schemaVersion: 1,
        browser: navigator.userAgent,
        gaussianCount: count,
        effectiveGaussianCount: effectiveCount,
        finalMemory: memory(),
        phases
    };
    document.getElementById('result').textContent = JSON.stringify(report);
</script>
